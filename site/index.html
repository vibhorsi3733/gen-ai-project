<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresher Jobs India</title>
<meta name="description" content="Fresher jobs and internships in India, collected from public company career boards, de-duplicated and tagged by role and city with an LLM. Refreshed daily.">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
    --accent: #2f5bea; --chip: #eef1fb; --chip-text: #2a3f8f; --intern: #e7f6ec; --intern-text: #1c6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214; --card: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2c2c31;
      --accent: #7c9bff; --chip: #23283a; --chip-text: #b8c6ff; --intern: #1d3326; --intern-text: #8fdcaa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .controls { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  @media (max-width: 680px) { .controls { grid-template-columns: 1fr 1fr; } .controls input { grid-column: 1 / -1; } }
  input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--card); color: var(--text); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .count { color: var(--muted); font-size: 13px; margin: 8px 0 12px; }
  .list { display: grid; gap: 8px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
         display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
  .job a.title { color: var(--text); font-weight: 600; text-decoration: none; }
  .job a.title:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; grid-column: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; margin-top: 6px; }
  .chip { background: var(--chip); color: var(--chip-text); font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .chip.lvl { font-weight: 600; }
  .chip.intern, .chip.fresh { background: var(--intern); color: var(--intern-text); }
  .chip.exp { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .src { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fresher jobs &amp; internships in India</h1>
  <p class="sub" id="sub">Loading…</p>

  <div class="controls">
    <input id="q" type="search" placeholder="Search title, company, skills…" autocomplete="off" aria-label="Search">
    <select id="role" aria-label="Role"><option value="">All roles</option></select>
    <select id="city" aria-label="City"><option value="">All cities</option></select>
    <select id="type" aria-label="Level">
      <option value="entry">Entry-level (intern / fresher / 0-2 yrs)</option>
      <option value="strict">Internships + freshers only</option>
      <option value="Internship">Internships only</option>
      <option value="all">Everything (incl. experienced)</option>
    </select>
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>

  <footer id="foot"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let JOBS = [];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fillSelect(el, field) {
  const counts = {};
  JOBS.forEach(j => [].concat(j[field]).forEach(v => counts[v] = (counts[v] || 0) + 1));
  Object.keys(counts).sort((a, b) => counts[b] - counts[a]).forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = `${v} (${counts[v]})`;
    el.appendChild(o);
  });
}

const LEVEL_SETS = {
  entry: ["Internship", "Fresher", "Early career"],
  strict: ["Internship", "Fresher"],
  Internship: ["Internship"],
};
const levelOk = (lvl, type) => !LEVEL_SETS[type] || LEVEL_SETS[type].includes(lvl);
const LEVEL_CLASS = { "Internship": "intern", "Fresher": "fresh", "Early career": "early", "Experienced": "exp" };

function render() {
  const terms = $("q").value.toLowerCase().split(/\s+/).filter(Boolean);
  const role = $("role").value, city = $("city").value, type = $("type").value;
  const out = JOBS.filter(j =>
    (!role || j.role === role) &&
    (!city || j.cities.includes(city)) &&
    levelOk(j.level, type) &&
    terms.every(t => j._hay.includes(t))
  );
  $("count").textContent = `${out.length} of ${JOBS.length} posts`;
  if (!out.length) { $("list").innerHTML = `<div class="empty">No posts match. Try clearing a filter.</div>`; return; }
  $("list").innerHTML = out.map(j => `
    <article class="job">
      <a class="title" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">${esc(j.title)}</a>
      <span class="src">${esc(j.source)}</span>
      <div class="meta">${esc(j.company)} · ${esc(j.location || "Location not given")}</div>
      <div class="chips">
        <span class="chip">${esc(j.role)}</span>
        ${j.cities.map(c => `<span class="chip">${esc(c)}</span>`).join("")}
        <span class="chip lvl ${LEVEL_CLASS[j.level] || ""}">${esc(j.level)}</span>
        ${j.first_seen ? `<span class="chip">Seen ${esc(j.first_seen)}</span>` : ""}
      </div>
    </article>`).join("");
}

function syncUrl() {
  const p = new URLSearchParams();
  ["q", "role", "city", "type"].forEach(k => { if ($(k).value) p.set(k, $(k).value); });
  history.replaceState(null, "", p.toString() ? `?${p}` : location.pathname);
}

async function main() {
  try {
    const [jobs, meta] = await Promise.all([
      fetch("jobs.json", { cache: "no-store" }).then(r => r.json()),
      fetch("meta.json", { cache: "no-store" }).then(r => r.json()),
    ]);
    JOBS = jobs.map(j => ({ ...j, _hay: `${j.title} ${j.company} ${j.location} ${j.role} ${j.cities.join(" ")} ${j.level}`.toLowerCase() }));
    const when = new Date(meta.updated_at).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", dateStyle: "medium", timeStyle: "short" });
    $("sub").textContent = `${meta.intern_or_fresher_posts} internship & fresher posts · ${meta.entry_posts} entry-level (0-2 yrs) · ` +
      `from ${meta.boards} company career boards · updated ${when} IST · refreshes daily`;
    $("foot").innerHTML = `Sources: ${meta.sources.map(esc).join(", ")}. Posts come from companies' public career-board APIs. ` +
      `Role, city and level tags are generated by ${esc(meta.model)}` +
      (meta.usd_per_1000_posts != null ? ` · measured tagging cost $${meta.usd_per_1000_posts} per 1,000 posts.` : ".") +
      ` Always confirm details on the original post.`;
    fillSelect($("role"), "role");
    fillSelect($("city"), "cities");
    const p = new URLSearchParams(location.search);
    ["q", "role", "city", "type"].forEach(k => { if (p.get(k)) $(k).value = p.get(k); });
    ["q", "role", "city", "type"].forEach(k => $(k).addEventListener("input", () => { render(); syncUrl(); }));
    render();
  } catch (e) {
    $("sub").textContent = "Could not load jobs.json.";
    console.error(e);
  }
}
main();
</script>
</body>
</html>
